<main class="login-page"><section class="login-card"><div class="login-brand"><span class="brand-mark">S</span><b>SW1</b><span>UML</span></div><div class="login-copy"><span class="eyebrow">UML CASE TOOL</span><h1>Crea tu cuenta</h1><p>Empieza a construir tus diagramas UML.</p></div><form (ngSubmit)="submit()"><label>Nombre<input name="firstName" [(ngModel)]="firstName" required /></label><label>Apellido<input name="lastName" [(ngModel)]="lastName" required /></label><label>Correo electrónico<input name="email" type="email" [(ngModel)]="email" required /></label><label>Contraseña<input name="password" type="password" [(ngModel)]="password" required /></label><label>Confirmar contraseña<input name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required /></label>@if (error()) { <p class="error-message">{{ error() }}</p> }<button class="btn btn-primary" type="submit" [disabled]="loading()">{{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }} <span>→</span></button></form><p class="signup">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p></section><section class="login-art"><div class="blob blob-one"></div><div class="blob blob-two"></div><div class="art-card"><strong>Tu espacio creativo</strong><small>Listo para construir algo increíble</small></div></section></main>
