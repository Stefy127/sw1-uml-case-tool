<main class="login-page">
  <section class="login-card">
    <div class="login-brand"><span class="brand-mark">S</span><b>SW1</b><span>UML</span></div>
    <div class="login-copy">
      <span class="eyebrow">UML CASE TOOL</span>
      <h1>Bienvenido</h1>
      <p>Diseña, colabora y convierte tus ideas en sistemas.</p>
    </div>
    <form (ngSubmit)="submit()">
      <label>Correo electrónico<input name="email" [(ngModel)]="email" type="email" placeholder="tu@correo.com" /></label
      ><label>Contraseña<input name="password" [(ngModel)]="password" type="password" placeholder="••••••••" /></label
      >@if (error()) { <p class="error-message">{{ error() }}</p> }<button class="btn btn-primary" type="submit" [disabled]="loading()">{{ loading() ? 'Iniciando...' : 'Iniciar sesión' }} <span>→</span></button>
    </form>
    <p class="signup">¿Aún no tienes cuenta? <a routerLink="/register">Crear cuenta</a></p>
  </section>
  <section class="login-art">
    <div class="blob blob-one"></div>
    <div class="blob blob-two"></div>
    <div class="art-card uml-art-card"><strong>Un modelo empieza con una relación</strong><small>Organiza ideas, clases y responsabilidades.</small><div class="uml-art-diagram"><div class="mini-uml user-box"><b>Usuario</b><span>+ nombre</span></div><div class="mini-uml project-box"><b>Proyecto</b><span>+ nombre</span></div><div class="mini-uml diagram-box"><b>Diagrama</b><span>+ versión</span></div><i class="uml-link link-one"></i><i class="uml-link link-two"></i></div></div>
  </section>
</main>
