services:

  postgres:
    image: postgres:16
    container_name: umltool-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.10
    container_name: umltool-n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: umltool-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: umltool-backend
    depends_on:
      - postgres
      - n8n
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      N8N_VOICE_WEBHOOK_URL: ${N8N_VOICE_WEBHOOK_URL}
      N8N_VOICE_WEBHOOK_TOKEN: ${N8N_VOICE_WEBHOOK_TOKEN}
      N8N_CONNECT_TIMEOUT_SECONDS: ${N8N_CONNECT_TIMEOUT_SECONDS}
      N8N_READ_TIMEOUT_SECONDS: ${N8N_READ_TIMEOUT_SECONDS}
      N8N_IMAGE_READ_TIMEOUT_SECONDS: ${N8N_IMAGE_READ_TIMEOUT_SECONDS:-${N8N_READ_TIMEOUT_SECONDS:-30}}
      N8N_UML_IMAGE_WEBHOOK_URL: ${N8N_UML_IMAGE_WEBHOOK_URL}
      N8N_UML_IMAGE_WEBHOOK_TOKEN: ${N8N_UML_IMAGE_WEBHOOK_TOKEN}
      N8N_UML_IMAGE_UPDATE_WEBHOOK_URL: ${N8N_UML_IMAGE_UPDATE_WEBHOOK_URL}
      AI_CHAT_MAX_MESSAGE_LENGTH: ${AI_CHAT_MAX_MESSAGE_LENGTH:-4000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      AI_ORCHESTRATOR_ENABLED: ${AI_ORCHESTRATOR_ENABLED:-true}
      AI_ORCHESTRATOR_QUEUE_CAPACITY: ${AI_ORCHESTRATOR_QUEUE_CAPACITY:-2}
      AI_ORCHESTRATOR_TIMEOUT_SECONDS: ${AI_ORCHESTRATOR_TIMEOUT_SECONDS:-120}
      AI_ANALYSIS_TIMEOUT_SECONDS: ${AI_ANALYSIS_TIMEOUT_SECONDS:-120}
    ports:
      - "${BACKEND_PORT}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: umltool-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:4200"

volumes:
  postgres_data:
  n8n_data:
  ollama_models:
