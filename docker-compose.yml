services:

  postgres:
    image: postgres:16
    container_name: umltool-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.10
    container_name: umltool-n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build:
      context: ./backend
    container_name: umltool-backend
    depends_on:
      - postgres
      - n8n
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      N8N_VOICE_WEBHOOK_URL: ${N8N_VOICE_WEBHOOK_URL}
      N8N_VOICE_WEBHOOK_TOKEN: ${N8N_VOICE_WEBHOOK_TOKEN}
      N8N_CONNECT_TIMEOUT_SECONDS: ${N8N_CONNECT_TIMEOUT_SECONDS}
      N8N_READ_TIMEOUT_SECONDS: ${N8N_READ_TIMEOUT_SECONDS}
      N8N_IMAGE_READ_TIMEOUT_SECONDS: ${N8N_IMAGE_READ_TIMEOUT_SECONDS:-${N8N_READ_TIMEOUT_SECONDS:-30}}
      N8N_UML_IMAGE_WEBHOOK_URL: ${N8N_UML_IMAGE_WEBHOOK_URL}
      N8N_UML_IMAGE_WEBHOOK_TOKEN: ${N8N_UML_IMAGE_WEBHOOK_TOKEN}
    ports:
      - "${BACKEND_PORT}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: umltool-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:4200"

volumes:
  postgres_data:
  n8n_data:
