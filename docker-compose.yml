services:

  postgres:
    image: postgres:16
    container_name: umltool-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: umltool-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_VOICE_WEBHOOK_URL: ${N8N_VOICE_WEBHOOK_URL}
      N8N_VOICE_WEBHOOK_TOKEN: ${N8N_VOICE_WEBHOOK_TOKEN}
      N8N_CONNECT_TIMEOUT_SECONDS: ${N8N_CONNECT_TIMEOUT_SECONDS}
      N8N_READ_TIMEOUT_SECONDS: ${N8N_READ_TIMEOUT_SECONDS}
      N8N_IMAGE_READ_TIMEOUT_SECONDS: ${N8N_IMAGE_READ_TIMEOUT_SECONDS:-${N8N_READ_TIMEOUT_SECONDS:-30}}
      N8N_UML_IMAGE_WEBHOOK_URL: ${N8N_UML_IMAGE_WEBHOOK_URL}
      N8N_UML_IMAGE_WEBHOOK_TOKEN: ${N8N_UML_IMAGE_WEBHOOK_TOKEN}
    ports:
      - "${BACKEND_PORT}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: umltool-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:4200"

volumes:
  postgres_data:
