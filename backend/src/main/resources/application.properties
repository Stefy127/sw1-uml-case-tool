spring.application.name=umltool

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
auth.jwt.secret=${JWT_SECRET:sw1-development-secret-change-me-32chars}
auth.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
ai.n8n.voice-webhook-url=${N8N_VOICE_WEBHOOK_URL:}
ai.n8n.voice-webhook-token=${N8N_VOICE_WEBHOOK_TOKEN:}
ai.n8n.connect-timeout-seconds=${N8N_CONNECT_TIMEOUT_SECONDS:10}
ai.n8n.read-timeout-seconds=${N8N_READ_TIMEOUT_SECONDS:30}
ai.n8n.image-read-timeout-seconds=${N8N_IMAGE_READ_TIMEOUT_SECONDS:${N8N_READ_TIMEOUT_SECONDS:30}}
ai.n8n.uml-image-webhook-url=${N8N_UML_IMAGE_WEBHOOK_URL:}
ai.n8n.uml-image-webhook-token=${N8N_UML_IMAGE_WEBHOOK_TOKEN:}
ai.n8n.uml-image-update-webhook-url=${N8N_UML_IMAGE_UPDATE_WEBHOOK_URL:}
ai.chat.max-message-length=${AI_CHAT_MAX_MESSAGE_LENGTH:4000}
# Optional integration setting for the future Spring AI/Ollama phase.
# The application does not call Ollama during startup and does not require it
# to serve the existing UML, chat, image, voice or XMI flows.
ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3.5:4b}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:ollama}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen3.5:4b}
spring.ai.ollama.chat.temperature=${OLLAMA_TEMPERATURE:0.2}
spring.ai.ollama.chat.think=false
spring.ai.ollama.chat.num-ctx=${OLLAMA_NUM_CTX:4096}
spring.ai.ollama.chat.keep-alive=${OLLAMA_KEEP_ALIVE:2m}
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.chat.client.tool-calling.enabled=false
ai.orchestrator.enabled=${AI_ORCHESTRATOR_ENABLED:true}
ai.orchestrator.queue-capacity=${AI_ORCHESTRATOR_QUEUE_CAPACITY:2}
ai.orchestrator.timeout-seconds=${AI_ORCHESTRATOR_TIMEOUT_SECONDS:120}
ai.memory.max-items=${AI_MEMORY_MAX_ITEMS:10}
ai.memory.max-content-length=${AI_MEMORY_MAX_CONTENT_LENGTH:2000}
ai.memory.max-context-chars=${AI_MEMORY_MAX_CONTEXT_CHARS:5000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
