spring.application.name=umltool

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
ai.n8n.voice-webhook-url=${N8N_VOICE_WEBHOOK_URL:}
ai.n8n.voice-webhook-token=${N8N_VOICE_WEBHOOK_TOKEN:}
ai.n8n.connect-timeout-seconds=${N8N_CONNECT_TIMEOUT_SECONDS:10}
ai.n8n.read-timeout-seconds=${N8N_READ_TIMEOUT_SECONDS:30}
